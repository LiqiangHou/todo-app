<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>To-Do App</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7fb;
      --panel: #ffffff;
      --text: #1f2430;
      --muted: #6a7386;
      --border: #d8deea;
      --accent: #3b82f6;
      --accent-soft: #dbeafe;
      --danger: #ef4444;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1218;
        --panel: #171c24;
        --text: #e9edf5;
        --muted: #a3afc2;
        --border: #2b3342;
        --accent: #60a5fa;
        --accent-soft: rgba(96, 165, 250, 0.22);
        --danger: #f87171;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.4;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      width: 100%;
      max-width: 480px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 1.35rem;
    }

    form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 14px;
    }

    input[type="text"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: inherit;
      padding: 10px 12px;
      font: inherit;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    button {
      border: 1px solid transparent;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      padding: 10px 14px;
      cursor: pointer;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 8px;
    }

    li {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 10px;
      background: color-mix(in srgb, var(--panel) 95%, var(--bg));
    }

    .check {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-radius: 999px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: border-color 180ms ease, background-color 220ms ease, transform 140ms ease;
      background: transparent;
      color: #fff;
      flex-shrink: 0;
    }

    .check:hover { transform: scale(1.04); }

    .check svg {
      width: 13px;
      height: 13px;
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 170ms ease, transform 230ms cubic-bezier(.22,.61,.36,1);
    }

    li.done .check {
      border-color: var(--accent);
      background: var(--accent);
    }

    li.done .check svg {
      opacity: 1;
      transform: scale(1);
    }

    .task-text {
      transition: color 180ms ease, opacity 180ms ease, text-decoration-color 180ms ease;
    }

    li.done .task-text {
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
      opacity: 0.85;
    }

    .delete {
      background: transparent;
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 35%, var(--border));
      padding: 7px 10px;
      font-weight: 600;
    }

    .delete:hover {
      background: color-mix(in srgb, var(--danger) 14%, transparent);
    }

    .empty {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.95em;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="app" aria-label="To-do app">
    <h1>To-Do</h1>
    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="Add a task..." autocomplete="off" />
      <button type="submit">Add</button>
    </form>
    <ul id="todo-list" aria-live="polite"></ul>
    <p id="empty" class="empty" hidden>No tasks yet. Add one above.</p>
  </main>

  <script>
    const STORAGE_KEY = "todo-app.tasks.v1";
    const EXAMPLE_TASKS = [
      { id: crypto.randomUUID(), text: "Plan the week", done: false },
      { id: crypto.randomUUID(), text: "Buy groceries", done: false },
      { id: crypto.randomUUID(), text: "Read 20 pages", done: true }
    ];

    function loadTasks() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return EXAMPLE_TASKS;
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return EXAMPLE_TASKS;
        return parsed.filter(t => t && typeof t.id === "string" && typeof t.text === "string" && typeof t.done === "boolean");
      } catch {
        return EXAMPLE_TASKS;
      }
    }

    let tasks = loadTasks();

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const list = document.getElementById("todo-list");
    const empty = document.getElementById("empty");

    function render() {
      list.innerHTML = "";
      empty.hidden = tasks.length !== 0;

      for (const task of tasks) {
        const li = document.createElement("li");
        li.dataset.id = task.id;
        if (task.done) li.classList.add("done");

        li.innerHTML = `
          <button class="check" type="button" aria-label="Mark ${task.text} as ${task.done ? "incomplete" : "complete"}" title="${task.done ? "Mark incomplete" : "Mark complete"}">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M9.55 18.2 3.9 12.55l1.4-1.4 4.25 4.25 9.15-9.15 1.4 1.4z"/>
            </svg>
          </button>
          <span class="task-text"></span>
          <button class="delete" type="button" aria-label="Delete ${task.text}" title="Delete task">Delete</button>
        `;

        li.querySelector(".task-text").textContent = task.text;
        list.appendChild(li);
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      tasks.unshift({ id: crypto.randomUUID(), text, done: false });
      saveTasks();
      render();
      form.reset();
      input.focus();
    });

    list.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      const li = button.closest("li");
      if (!li) return;
      const id = li.dataset.id;

      if (button.classList.contains("check")) {
        tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
      } else if (button.classList.contains("delete")) {
        tasks = tasks.filter(t => t.id !== id);
      } else {
        return;
      }

      saveTasks();
      render();
    });

    saveTasks();
    render();
  </script>
</body>
</html>
